  name: watertank
  friendly_name: Watertank

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "+G4Cl1tsTrXfbVTdAP8k8y5UXgFIfoHZbYYvAa+ZK7s="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Watertank Fallback Hotspot
    password: "Zji1hGvhanYb"

captive_portal:

switch:
  - platform: gpio
    name: GPIO2-LED
    id: switch_gpio_1
    pin: GPIO2

#sensor:  
  #- platform: adc
  #  pin: VCC
  #  name: VCC-Voltage
  #  id: vcc

time: 
  - platform: homeassistant 
    id: esptime

i2c:
  - id: i2c_1
    scl: GPIO5
    sda: GPIO4
    frequency: 20kHz  # Reduced drastically from 400kHz to fix 10m cable capacitance

font:  
  - file: "font/CourierPrime.ttf"    
    id: myfont    
    size: 12  
  - file: "font/CourierPrime.ttf"    
    id: font_small    
    size: 12
  - file: "font/CourierPrime.ttf"    
    id: font_large    
    size: 16

display:
  - platform: ssd1306_i2c
    id: display_ssd1306_i2c_2
    model: SSD1306_128X64
    address: 0x3C
    update_interval: 5s
    #external_vcc: true
      #it.fill(COLOR_OFF);
      #it.line(0, 0, 50, 50);
      #it.circle(25, 25, 10); 
    lambda: |-
      // Print the main title header
      it.printf(0, 0, id(font_small), "TANK DEPTH MONITOR");
      it.line(0, 15, 128, 15);
      // Print a header for the values
      it.printf(0,15, id(font_small), "   AIR     WATER  ");
      // Print the current air temperature at the middle of the screen
      if (id(air_temp).has_state()) {
        it.printf(0, 26, id(font_small), "%6.1f°C", id(air_temp).state);
      }
      // Print the current water temperature after the air temperature
      if (id(water_temp).has_state()) {
        it.printf(68, 26, id(font_small), "%6.1f°C", id(water_temp).state);
      }
      // Print the current air pressure
      if (id(air_pressure).has_state()) {
        it.printf(0, 36, id(font_small), "%7.2f", id(air_pressure).state);
      }
      // Print the current water pressure
      if (id(water_pressure).has_state()) {
        it.printf(68, 36, id(font_small), "%7.2f", id(water_pressure).state);
      }      
      // Print the calculated water depth in a large, easily readable format
      if (id(water_depth).has_state()) {
        it.printf(0, 50, id(font_small), "%6.1fmm", id(water_depth).state);
        it.printf(68, 50, id(font_small), "%6.1f L", id(water_volume).state);
      } else {
        it.printf(0, 50, id(font_small), "Loading...");
      }
      // Print Some lines
      it.line(64, 15, 64, 49);
      it.line(0, 49, 128, 49);

external_components:
  - source:
      type: git
      url: https://github.com/JohMah/esphome-lps28
    components: [ lps28 ]

sensor:
  - platform: adc
    pin: VCC
    name: VCC-Voltage
    id: vcc

   # --- SENSOR A: ABOVE WATER REFERENCE ---
  - platform: lps28
    address: 0x5D
    update_interval: 10s # Low frequency to protect long-distance data integrity
    pressure:
      name: "Atmospheric Air Pressure"
      id: air_pressure
    temperature:
      name: "Air Temperature"
      id: air_temp

  # --- SENSOR B: SUBMERGED UNDERWATER SENSOR (10m Cable) ---
  - platform: lps28
    address: 0x5C
    update_interval: 5s # Reduced from 2s to minimize data collisions on long lines
    pressure:
      name: "Submerged Absolute Pressure"
      id: water_pressure
    temperature:
      name: "Water Temperature"
      id: water_temp

  # --- AUTOMATIC SUBTRACTION SENSOR ---
  - platform: template
    name: "True Water Depth"
    id: water_depth
    unit_of_measurement: "mm"
    accuracy_decimals: 2
    device_class: "distance"
    state_class: "measurement"
    lambda: |-
      if (id(water_pressure).has_state() && id(air_pressure).has_state()) {
        float delta_p = id(water_pressure).state - id(air_pressure).state;
        if (delta_p > 0.0f) {
          return delta_p * 10.197f;
        }
      }
      return 0.0f;
    update_interval: 5s
  # --- REAL-TIME VOLUME CALCULATION ---
  - platform: template
    name: "Water Volume"
    id: water_volume
    unit_of_measurement: "L"
    accuracy_decimals: 1
    device_class: "volume"
    state_class: "measurement"
    icon: "mdi:water-boiler" # Adds a clean tank/vessel icon in Home Assistant
    lambda: |-
      if (id(water_depth).has_state()) {
        // Multiply depth (mm) by 4.55 liters per mm
        float computed_volume = id(water_depth).state * 4.55f;
        
        // Sanity check: prevent ghost readings if baseline values drift slightly
        if (computed_volume > 0.0f) {
          return computed_volume;
        }
      }
      return 0.0f;
    update_interval: 5s